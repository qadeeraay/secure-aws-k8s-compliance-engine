apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-api-sa
  namespace: compliance-workload
  annotations:
    # IAM Roles for Service Accounts (IRSA) - Scoped to least-privilege IAM policy
    # Satisfies NIST SP 800-53 AC-6, ISO 27002 Control 5.15, SOC 2 CC6.1
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/compliance-engine-k8s-workload-role"
automountServiceAccountToken: false # Checkov CKV_K8S_38: Prevent default secret token exposure
