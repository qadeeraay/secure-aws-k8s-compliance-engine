# ==============================================================================
# Zero-Trust Kubernetes NetworkPolicy (Default Deny + Least Privilege Egress)
# Compliance Mappings:
# - NIST SP 800-53 R5: SC-7 (Boundary Protection), AC-4 (Information Flow Enforcement)
# - ISO 27002:2022: Control 8.20 (Network Security), Control 8.22 (Segregation of Networks)
# - SOC 2 Type II: CC6.6 (Logical Boundary Protection)
# - PCI DSS v4.0: Requirement 1.2, 1.3 (Network Traffic Filtering)
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-compliance-workload
  namespace: compliance-workload
spec:
  podSelector:
    matchLabels:
      app: secure-api
  policyTypes:
    - Ingress
    - Egress

  # Ingress Rule: Allow inbound HTTP strictly on port 8080 from ingress tier
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: ingress
      ports:
        - protocol: TCP
          port: 8080

  # Egress Rules: Strictly scoped to CoreDNS (port 53), Database (port 5432), and HTTPS (port 443)
  egress:
    # 1. Allow DNS Resolution via kube-dns in kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # 2. Allow outbound PostgreSQL traffic strictly to database tier
    - to:
        - podSelector:
            matchLabels:
              tier: database
      ports:
        - protocol: TCP
          port: 5432

    # 3. Allow outbound HTTPS strictly to AWS endpoints / internet
    - ports:
        - protocol: TCP
          port: 443
